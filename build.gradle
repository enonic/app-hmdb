plugins {
    id 'maven-publish'
    id 'com.enonic.defaults' version '2.1.7'
    id 'com.enonic.xp.app'
    id 'com.github.node-gradle.node' version '7.1.0'
}

dependencies {
    implementation xplibs.api.script
    include xplibs.websocket
    include xplibs.auth
    include xplibs.project
    include xplibs.portal
    include xplibs.cluster
    include xplibs.context
    include xplibs.content
    include xplibs.export
    include xplibs.task
    include "com.enonic.lib:lib-asset:2.0.1"
    include "com.enonic.lib:lib-thymeleaf:3.0.0"

    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.1'
    testRuntimeOnly 'org.graalvm.polyglot:js:25.0.3'
}

repositories {
    mavenCentral()
    xp.enonicRepo('dev')
}

node {
    download = true
    version = '24.11.0'
}

processResources {
    exclude '**/.gitkeep'
    exclude '**/*.json'
    exclude '**/*.ts'
    exclude '**/*.tsx'
}

tasks.register('npmBuild', NpmTask) {
    args = [
        'run',
        '--silent',
        'build'
    ]
    dependsOn npmInstall
    environment = [
        'FORCE_COLOR': 'true',
        'LOG_LEVEL_FROM_GRADLE': gradle.startParameter.logLevel.toString(),
        'NODE_ENV': project.hasProperty('dev') || project.hasProperty('development') ? 'development' : 'production'
    ]
    inputs.dir 'src/main/resources'
    outputs.dir 'build/resources/main'
    outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

tasks.register('npmCheck', NpmTask) {
    dependsOn npmInstall
    args = [
        'run',
        'check'
    ]
    environment = [
        'FORCE_COLOR': 'true',
    ]
}

check.dependsOn npmCheck

tasks.named('compileTestJava') {
    dependsOn npmBuild
}

test {
    dependsOn npmBuild
    useJUnitPlatform()
}

def testGraalJs = tasks.register('testGraalJs', Test) {
    dependsOn npmBuild
    group = 'verification'
    description = 'Runs tests with the GraalJS script engine.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'xp.script-engine', 'GraalJS'
    shouldRunAfter test
}

check.dependsOn testGraalJs

tasks.withType(Copy).configureEach {
    includeEmptyDirs = false
}
